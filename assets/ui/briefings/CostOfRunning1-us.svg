<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1800" viewBox="0 0 1400 1800">
  <defs>
    <filter id="paperNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="18"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <style>
      .paper{fill:#eadfc4;filter:url(#paperNoise)}
      .ink{fill:#111}
      .muted{fill:#272018}
      .line{stroke:#111;stroke-width:3;fill:none}
      .thin{stroke:#111;stroke-width:2;fill:none}
      text{font-family:"Courier New",monospace;font-weight:700;letter-spacing:.02em}
      .h1{font-size:82px;letter-spacing:.16em}
      .h2{font-size:34px;letter-spacing:.08em}
      .label{font-size:28px}
      .body{font-size:25px;font-weight:700}
      .small{font-size:22px}
      .tiny{font-size:19px}
    </style>
  </defs>
  <rect x="54" y="48" width="1292" height="1704" rx="26" class="paper"/>
  <rect x="84" y="82" width="1232" height="1644" rx="12" class="thin" opacity=".45"/>
  <text x="700" y="150" text-anchor="middle" class="ink h2">TERRAGEN SYSTEMS</text>
  <text x="700" y="210" text-anchor="middle" class="ink h2">FCU-16 COMPACT FUSION CORE CONTROLLER</text>
  <text x="700" y="310" text-anchor="middle" class="ink h1">SHIFT BRIEF</text>
  <path d="M130 354 H1270" class="line"/>

  <text x="150" y="420" class="ink label">Title:</text>
  <text x="420" y="420" class="ink label">COST OF RUNNING TRIAL</text>
  <text x="150" y="468" class="ink label">Profile:</text>
  <text x="420" y="468" class="ink label">FUEL BLEND ECONOMY TEST</text>
  <text x="150" y="516" class="ink label">Duration:</text>
  <text x="420" y="516" class="ink label">03:00</text>

  <rect x="120" y="570" width="1160" height="330" class="thin"/>
  <path d="M700 570 V900" class="thin"/>
  <text x="160" y="622" class="ink label">PURPOSE OF RUN</text>
  <text x="740" y="622" class="ink label">ACCEPTANCE CRITERIA</text>
  <text x="160" y="690" class="muted body">Test reduced-cost fuel blend behavior</text>
  <text x="160" y="730" class="muted body">during a normal operator shift.</text>
  <text x="160" y="790" class="muted body">Mixture quality may drift without warning.</text>
  <text x="160" y="830" class="muted body">Maintain output without quench or runaway.</text>
  <text x="740" y="690" class="muted body">- Complete scheduled 03:00 burn</text>
  <text x="740" y="740" class="muted body">- Avoid automatic protection trip</text>
  <text x="740" y="790" class="muted body">- Keep core stress within safe limit</text>
  <text x="740" y="840" class="muted body">- Record response to poor fuel quality</text>

  <rect x="120" y="940" width="1160" height="355" class="thin"/>
  <text x="160" y="992" class="ink label">FUEL QUALITY INDICATOR</text>
  <text x="160" y="1060" class="body" fill="#0a612f">GREEN</text>
  <text x="310" y="1060" class="muted body">Standard blend. Predictable heat per MW.</text>
  <text x="160" y="1118" class="body" fill="#9c6c00">YELLOW</text>
  <text x="310" y="1118" class="muted body">Economy blend. Heat drift, lag, cold dips, soft output.</text>
  <text x="160" y="1176" class="body" fill="#8a1510">RED</text>
  <text x="310" y="1176" class="muted body">Unstable blend. Heat spikes, poor efficiency, field stress.</text>
  <text x="160" y="1234" class="body" fill="#555">OFF</text>
  <text x="310" y="1234" class="muted body">No usable feed. Expect output loss and possible stall.</text>

  <rect x="120" y="1335" width="1160" height="205" class="thin"/>
  <text x="160" y="1388" class="ink label">OPERATOR NOTES</text>
  <text x="160" y="1452" class="muted body">- Demand schedule: 00:00 600 MW / 01:00 760 MW / 02:00 920 MW</text>
  <text x="160" y="1494" class="muted body">- Do not chase every small temperature twitch; watch the trend</text>
  <text x="160" y="1536" class="muted body">- A cold dip can be as dangerous as overheating</text>

  <rect x="120" y="1580" width="1160" height="110" class="thin"/>
  <text x="160" y="1630" class="ink small">CORE STALL RECOVERY: FUEL INJECTION >= 30%  /  COOLANT FLOW <= 58%  /  HOLD PULSE</text>
  <text x="150" y="1730" class="ink tiny">BRIEFING DOC ID: BRF-FCU16-004</text>
  <text x="650" y="1730" class="ink tiny">REV: A.03</text>
  <text x="980" y="1730" class="ink tiny">AUTHORIZED PERSONNEL ONLY</text>
</svg>
